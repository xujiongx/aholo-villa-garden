<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AHOLO 世界列表 · Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">AHOLO</span>
        <span class="brand-sub">Spatial Gen Demo</span>
      </div>
      <div class="status-chip" id="statusChip">连接中…</div>
    </header>

    <main class="layout">
      <section class="panel">
        <p class="eyebrow">我的世界</p>
        <h1>场景列表</h1>
        <p class="lede">
          优先选「完整可玩别墅庭院」。进入后会生成可操控 3D 人物：点击锁定鼠标，WASD
          行走，鼠标转视角。
        </p>

        <div class="actions">
          <button type="button" class="btn ghost" id="refreshBtn">刷新列表</button>
          <button type="button" class="btn ghost" id="regenBtn">再生成一个花园</button>
        </div>

        <p class="hint" id="hint">正在拉取任务列表…</p>
      </section>

      <section class="world-list" id="worldList" aria-live="polite"></section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
